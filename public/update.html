<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자동 업데이트 켜기 · 우리집 가계부</title>
<link rel="icon" href="/icon-180.png">
<style>
  body { margin: 0; background: #f6f7f5; color: #2b2f2c; font: 16px/1.7 -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
  main { max-width: 560px; margin: 40px auto; padding: 28px 30px; background: #fff; border-radius: 14px; box-shadow: 0 2px 10px #0001; }
  h1 { color: #3f6e5a; font-size: 22px; margin: 0 0 6px; }
  p { margin: 8px 0; }
  .muted { color: #6b736e; font-size: 14px; }
  label { display: block; margin-top: 18px; font-weight: 600; }
  input { width: 100%; box-sizing: border-box; margin-top: 6px; padding: 10px 12px; font-size: 16px; border: 1px solid #cfd6d1; border-radius: 8px; }
  input:focus { outline: none; border-color: #3f6e5a; }
  button { margin-top: 22px; width: 100%; padding: 13px; font-size: 17px; font-weight: 600; color: #fff; background: #3f6e5a; border: 0; border-radius: 10px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  ol { padding-left: 22px; margin: 6px 0; }
  .box { margin-top: 22px; padding: 14px 16px; background: #e6f0eb; border-radius: 10px; font-size: 15px; }
  #msg { margin-top: 12px; color: #b8433a; font-size: 14px; }
  a { color: #3f6e5a; }
</style>
</head>
<body>
<main>
  <h1>🌱 자동 업데이트 켜기</h1>
  <p>한 번만 해 두면, 매일 새벽 3시에 새 기능을 저절로 받아요.<br><span class="muted">기록한 가계부 내용은 그대로 있어요.</span></p>

  <label for="id">내 GitHub 아이디</label>
  <input id="id" placeholder="예: kim-sister" autocomplete="off" autocapitalize="off" spellcheck="false">
  <p class="muted">GitHub에 로그인한 뒤 오른쪽 위 동그란 사진을 누르면 맨 위에 보이는 이름이에요.</p>

  <label for="repo">내 저장소 이름</label>
  <input id="repo" autocomplete="off" autocapitalize="off" spellcheck="false">
  <p class="muted">설치할 때 정한 이름이라 보통 그대로 두면 돼요.</p>

  <button id="go">GitHub에서 켜기</button>
  <div id="msg"></div>

  <div class="box">
    <b>GitHub 화면이 열리면</b>
    <ol>
      <li>오른쪽 위 초록색 <b>Commit changes...</b> 버튼을 눌러요.</li>
      <li>작은 창이 뜨면 아래쪽 초록색 <b>Commit changes</b>를 한 번 더 눌러요.</li>
    </ol>
    끝이에요. 이 창은 닫아도 돼요.
  </div>
</main>
<script>
  // 이 가계부 주소의 첫 부분(예: uri-gagyebu.xxx.workers.dev → uri-gagyebu)이 설치 때 정한 이름 = 저장소 이름
  const UPSTREAM = 'https://raw.githubusercontent.com/moamoa-money/uri-gagyebu/main/.github/workflows/sync-upstream.yml';
  const $ = (s) => document.getElementById(s);
  const host = location.hostname.split('.')[0];
  $('repo').value = /^[A-Za-z0-9._-]+$/.test(host) && host !== 'localhost' ? host : 'uri-gagyebu';
  $('id').value = localStorage.getItem('gb_github_id') || '';
  $('go').onclick = async () => {
    const id = $('id').value.trim().replace(/^@/, ''), repo = $('repo').value.trim();
    $('msg').textContent = '';
    if (!/^[A-Za-z0-9-]+$/.test(id)) { $('msg').textContent = 'GitHub 아이디를 확인해 주세요 (영어·숫자·- 만 들어가요).'; return; }
    if (!/^[A-Za-z0-9._-]+$/.test(repo)) { $('msg').textContent = '저장소 이름을 확인해 주세요.'; return; }
    localStorage.setItem('gb_github_id', id);
    $('go').disabled = true;
    try {
      const r = await fetch(UPSTREAM, { cache: 'no-store' });
      if (!r.ok) throw new Error();
      const text = await r.text();
      location.href = `https://github.com/${id}/${repo}/new/main?filename=${encodeURIComponent('.github/workflows/sync-upstream.yml')}&value=${encodeURIComponent(text)}`;
    } catch {
      $('msg').textContent = '원본을 불러오지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요.';
      $('go').disabled = false;
    }
  };
</script>
</body>
</html>
